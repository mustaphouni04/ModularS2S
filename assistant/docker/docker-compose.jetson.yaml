# Brings up the three GPU-accelerated sidecar services the assistant talks
# to over localhost. Built from images produced by jetson-containers
# (../../jetson-containers) - run `jetson-containers build <pkg>` first if
# the exact tag isn't available on Docker Hub for your L4T version.
#
# The assistant binary itself is NOT containerized here: it needs direct
# ALSA/PortAudio access to the Jetson's mic/speaker and runs natively on the
# host (see ../README.md).
#
# Usage:
#   docker compose -f docker-compose.jetson.yaml up -d
name: modular-s2s

services:
  ollama:
    image: dustynv/ollama:r36.4.0
    container_name: ollama
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    init: false
    tty: true
    stdin_open: true
    volumes:
      - ollama-models:/data/models/ollama
      - /etc/localtime:/etc/localtime:ro

  wyoming-whisper:
    image: dustynv/wyoming-whisper:latest-r36.2.0
    container_name: wyoming-whisper
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    init: false
    environment:
      WHISPER_PORT: "10300"
      WHISPER_MODEL: "base-int8"
      WHISPER_LANGUAGE: "en"
    volumes:
      - whisper-models:/share/whisper
      - /etc/localtime:/etc/localtime:ro

  wyoming-piper:
    image: dustynv/wyoming-piper:master-r36.2.0
    container_name: wyoming-piper
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    init: false
    # This image is JetPack-6/CUDA-12.2 vintage; onnxruntime's CUDA execution
    # provider hard-crashes on this host's JetPack 7.2/CUDA 13.2 stack
    # (CUDA failure 801: operation not supported, from cudaSetDevice). The
    # image's entrypoint script hardcodes `--cuda` regardless of the
    # PIPER_USE_CUDA env var (that var isn't wired to anything in this
    # build), so the only way to force CPU is to bypass the s6-overlay
    # entrypoint and invoke wyoming_piper directly without --cuda. CPU
    # synthesis measured at real-time factor ~0.18 (5x faster than
    # real-time) for short sentences, so it's not a practical bottleneck.
    entrypoint: ["python3", "-m", "wyoming_piper"]
    command:
      - "--piper=/opt/piper/build/piper"
      - "--uri=tcp://0.0.0.0:10200"
      - "--length-scale=1.0"
      - "--noise-scale=0.667"
      - "--noise-w=0.333"
      - "--speaker=0"
      - "--voice=en_US-lessac-medium"
      - "--max-piper-procs=1"
      - "--espeak-data-dir=/usr/local/share/espeak-ng-data"
      - "--data-dir=/data"
      - "--data-dir=/share/piper"
      - "--data-dir=/data/models/piper"
      - "--download-dir=/data/models/piper"
      - "--update-voices"
      - "--debug"
    volumes:
      - piper-models:/data/models/piper
      - /etc/localtime:/etc/localtime:ro

volumes:
  ollama-models:
  whisper-models:
  piper-models:
